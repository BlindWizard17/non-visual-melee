# The fork's CI release. Each trigger:
#
# - A push to dev, the branch everyday work lands on, builds the Windows
#   x86_64 package and the macOS packages (arm64, and Intel, which nobody
#   tests) and publishes them together as the rolling prerelease ci-latest,
#   so the newest build is one plain download link away.
# - A push to master builds nothing: master moves only when a release is
#   cut (ADR-0011).
# - A pushed tag a11y-v<version> (or a dispatch on one) builds a versioned
#   release (ADR-0011). The release check job runs
#   tools/a11y/release_notes.py before any build, and the run stops on a
#   failed check, the job's log naming it: the tag must be a11y-v plus
#   src/pc/a11y/FORK_VERSION, CHANGELOG.md's first version section that
#   version's, the tagged commit on master, and no release for the tag may
#   exist yet, draft or published. Then the Windows job alone builds,
#   unlabelled (the macOS jobs are skipped until a Mac build is
#   play-tested), and the release job checks again and creates the release
#   as a draft, titled "Non-Visual Melee <version> beta", not a prerelease,
#   with the Windows zip and the notes the script writes. A draft is
#   invisible to players and never "latest": the release skill checks it
#   and publishes it. A run never replaces a release: a failed draft is
#   deleted by hand before a re-run.
# - A dispatch on any branch (`gh workflow run a11y.yml --ref <branch>`)
#   builds and keeps its zips as run artifacts and leaves ci-latest and
#   the releases alone.
#
# Each build job keeps its zip as a run artifact; the publish job writes
# ci-latest, only on a push to dev, and the release job a versioned
# release's draft, only on a tag. Every build job sets the app version
# (MELEE_VERSION) from the root VERSION file, on every trigger, so a tag
# build plays online with the base port's release and never takes the tag's
# name as its version. Every zip holds readme.html and changelog.html beside
# the game, made by pandoc from ACCESSIBILITY.md and CHANGELOG.md at the
# commit built (tools/a11y/make_documents.py).
#
# The Windows zip is the one that must ship: publish needs the Windows job to
# pass, and takes whichever macOS zips were built. A failed macOS job leaves
# its zip out of ci-latest for that commit, and ci-latest's notes say so; the
# run itself still shows as failed.
#
# Fork-owned file, so base merges never conflict here. The base port's own
# workflows (build.yml, pages.yml) stay in the tree but are disabled in the
# fork's GitHub settings (gh workflow disable); a base merge that adds a
# workflow file needs the same treatment. The build steps follow the base
# port's Windows and macOS jobs in build.yml.
name: A11y

on:
  push:
    branches: [dev]
    tags: ['a11y-v*']
  # Any branch: `gh workflow run a11y.yml --ref <branch>`.
  workflow_dispatch:

permissions:
  contents: read

# The newest push to a branch wins: an older build of the same branch still
# running is cancelled. Each branch and tag has its own group, so a topic
# branch's run never cancels dev's, or the other way round.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The update check finds a release by this name and MAC_ZIP's
  # (asset_name in src/pc/a11y/update_check.cpp): rename them together.
  ZIP_NAME: NonVisualMelee-Windows-x86_64.zip

jobs:
  # A tag's checks, before any build (tools/a11y/release_notes.py --help
  # says each). The full history is fetched so the script can ask whether
  # the tagged commit is on origin/master. contents: write lets gh see draft
  # releases, which a token with read access alone is never shown.
  release-check:
    name: Check the release
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the tag and write the notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/a11y/release_notes.py "${GITHUB_REF_NAME}" \
            --commit "${GITHUB_SHA}" --repo "${GITHUB_REPOSITORY}" --notes notes.md
          cat notes.md

  windows:
    name: Windows (x86_64)
    # After a tag's checks; on any other trigger the check job is skipped
    # and this one runs at once.
    needs: [release-check]
    if: ${{ !cancelled() && (needs.release-check.result == 'success' || needs.release-check.result == 'skipped') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Same toolchain as the base port's Windows job in build.yml, and
      # pandoc for the zip's documents.
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build cmake zip cabextract curl mingw-w64 pandoc
          # aurora's C++20 code needs std::thread, which only the POSIX
          # threading model provides.
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix

      # The app version from the root VERSION file, never a tag's name
      # (the root CMakeLists.txt would take a tag's), and the fork version's
      # build label, which the configure reads (src/pc/a11y/a11y.cmake):
      # "none", unlabelled, on a release's tag, otherwise "dev build" and
      # the commit's short hash.
      - name: Set the version and the build label
        run: |
          echo "MELEE_VERSION=$(head -n 1 VERSION)" >> "$GITHUB_ENV"
          if [[ "${GITHUB_REF}" == refs/tags/a11y-v* ]]; then
            label="none"
          else
            label="dev build ${GITHUB_SHA::7}"
          fi
          echo "MELEE_A11Y_BUILD_LABEL=${label}" >> "$GITHUB_ENV"

      - name: Build and package
        env:
          TARGET_ARCH: x86_64
        run: tools/package_windows.sh

      # The connection checker (src/pc/a11y/netcheck.cpp), beside melee.exe,
      # so a friend testing their network has it in the same download.
      # package_windows.sh builds the melee target alone, so it is built here
      # in the same build directory.
      - name: Add the connection checker
        run: |
          ninja -C build-win melee-netcheck
          cp build-win/melee-netcheck.exe dist/melee-windows-x86_64/
          cd dist
          zip -q Melee-Windows-x86_64.zip melee-windows-x86_64/melee-netcheck.exe

      # readme.html (ACCESSIBILITY.md) and changelog.html (CHANGELOG.md),
      # beside melee.exe. make_documents.py fails the job on a page pandoc
      # left missing or empty, and unzip -l on one missing from the zip.
      - name: Add readme.html and changelog.html
        run: |
          python3 tools/a11y/make_documents.py dist/melee-windows-x86_64
          cd dist
          docs="melee-windows-x86_64/readme.html melee-windows-x86_64/changelog.html"
          zip -q Melee-Windows-x86_64.zip ${docs}
          unzip -l Melee-Windows-x86_64.zip ${docs}

      # package_windows.sh ships prism.dll; Prism's licences (its own and
      # those of the libraries inside it) are added here, beside the game,
      # with those of Signalsmith Stretch, compiled into melee.exe (the
      # pitch shifter's and the Signalsmith DSP library's inside it).
      - name: Add Prism's and Signalsmith Stretch's licences
        working-directory: dist
        run: |
          prism_dir="$(ls -d ../build-win/prism-*/ | head -n 1)"
          mkdir -p melee-windows-x86_64/LICENSES.prism
          cp -r "${prism_dir}LICENSES/." "${prism_dir}NOTICE" melee-windows-x86_64/LICENSES.prism/
          stretch_dir="$(ls -d ../build-win/signalsmith-stretch-*/ | head -n 1)"
          mkdir -p melee-windows-x86_64/LICENSES.signalsmith-stretch
          cp "${stretch_dir}LICENSE.txt" melee-windows-x86_64/LICENSES.signalsmith-stretch/LICENSE.txt
          cp "${stretch_dir}dsp/LICENSE.txt" melee-windows-x86_64/LICENSES.signalsmith-stretch/LICENSE-dsp.txt
          zip -qr Melee-Windows-x86_64.zip melee-windows-x86_64/LICENSES.prism melee-windows-x86_64/LICENSES.signalsmith-stretch
          mv Melee-Windows-x86_64.zip "${ZIP_NAME}"
          ls -lh "${ZIP_NAME}"

      - uses: actions/upload-artifact@v4
        with:
          name: NonVisualMelee-Windows-x86_64
          path: dist/${{ env.ZIP_NAME }}
          if-no-files-found: error

  macos:
    name: macOS (${{ matrix.arch }})
    # Not on a release's tag: versioned releases ship the Windows zip alone
    # until a Mac build is play-tested (ADR-0011).
    if: ${{ github.ref_type != 'tag' }}
    # The oldest macOS the zip runs on is the highest minimum among melee
    # and the dylibs bundled with it. The base port sets no deployment
    # target, so its build gets the runner's macOS; here melee, SDL and the
    # connection checker aim at macOS 13.3 (MACOSX_DEPLOYMENT_TARGET, which
    # CMake, clang and GCC all read), where libc++ first has std::to_chars
    # for floats, which the fork's settings use; Prism's own floor is 11.
    # Homebrew's dylibs (libpng, freetype, brotli, libusb) are built for
    # the macOS their runner has, so arm64 builds on macos-15 rather than
    # the base port's macos-26: macOS 15 is then the zip's real minimum.
    # "Check the zip" prints each binary's minimum.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.3"
      # package_macos.sh's own default build directory, named here for the
      # steps after it.
      BUILD_DIR: ${{ github.workspace }}/build/macos
      STAGE: melee-macos-${{ matrix.arch }}
      MAC_ZIP: NonVisualMelee-macOS-${{ matrix.arch }}.zip
    steps:
      - uses: actions/checkout@v4

      # Same as the base port's macOS job in build.yml: Apple clang builds the
      # C++ and links; the decomp's C, and the fork's game_access.c, go
      # through Homebrew's gcc by tools/gcc_launcher.py, for
      # scalar_storage_order. pandoc makes the zip's documents.
      - name: Install build dependencies
        run: |
          xcodebuild -version
          brew install gcc cmake ninja zstd libpng freetype libusb pandoc

      - name: Verify native rollback snapshot restore
        run: python3 tools/test_snapshot_platforms.py SnapshotPlatforms.test_native_mac_restore

      # The app version and the build label as in the Windows job; a tag
      # never reaches this job, so the label is always a dev build's.
      - name: Set the version and the build label
        run: |
          echo "MELEE_VERSION=$(head -n 1 VERSION)" >> "$GITHUB_ENV"
          echo "MELEE_A11Y_BUILD_LABEL=dev build ${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # Makes build/macos/Melee.app, with Prism's dylib bundled from beside
      # melee into Contents/Frameworks, ad-hoc signed and verified
      # (codesign --verify), and lists Contents/Frameworks.
      - name: Build and package
        run: tools/package_macos.sh

      # game_access.c reads the game's big-endian disc structs, so it must be
      # compiled by GCC, as the decomp is (src/pc/a11y/a11y.cmake,
      # a11y_melee_game). It stops with #error under clang, so this build
      # passing is the proof; these lines show the route in the log: the
      # launcher in front of the compile, the gcc-NN it picks (the same
      # search as tools/gcc_launcher.py, which GCC_BIN would override), and
      # the compiler that wrote the object, as its debug info names it
      # ("GNU C17 <version> ...").
      - name: Show game_access.c compiled by GCC
        run: |
          ninja -C "${BUILD_DIR}" -t commands a11y_melee_game | grep 'game_access\.c'
          echo "GCC_BIN=${GCC_BIN:-}"
          for v in $(seq 20 -1 13); do
            if command -v "gcc-${v}"; then
              "gcc-${v}" --version | head -n 1
              break
            fi
          done
          obj="$(find "${BUILD_DIR}/CMakeFiles/a11y_melee_game.dir" -name 'game_access.c.o')"
          echo "${obj}"
          dwarfdump "${obj}" | grep -m 1 DW_AT_producer || echo "(no producer in the object's debug info)"

      # Prism found at run time: the build directory's rpath for the copy
      # beside melee, and the bundle's copy with its @rpath name. libtolk,
      # Prism's unused Tolk shim, must not come along.
      - name: Show Prism in the build and the bundle
        working-directory: build/macos
        run: |
          otool -l melee | grep -A2 LC_RPATH
          ls Melee.app/Contents/Frameworks
          if ls Melee.app/Contents/Frameworks | grep -q tolk; then
            echo "error: libtolk was bundled" >&2
            exit 1
          fi
          otool -L Melee.app/Contents/MacOS/melee | grep prism
          otool -D Melee.app/Contents/Frameworks/libprism.dylib
          ls prism-*/LICENSES prism-*/NOTICE

      # readme.html (ACCESSIBILITY.md) and changelog.html (CHANGELOG.md),
      # into the zip's folder beside Melee.app. make_documents.py fails the
      # job on a page pandoc left missing or empty.
      - name: Make readme.html and changelog.html
        run: python3 tools/a11y/make_documents.py "dist/${STAGE}"

      # The zip holds one folder, as the Windows zip does: Melee.app, the
      # connection checker beside it, the two documents made above, and
      # Prism's and Signalsmith Stretch's licences. package_macos.sh builds
      # the melee target alone, so the checker is built here in the same
      # build directory. It links only the system's libraries; it is stripped
      # as melee is and ad-hoc signed, as the arm64 kernel needs.
      - name: Add the connection checker and the licences
        run: |
          ninja -C "${BUILD_DIR}" melee-netcheck
          mkdir -p "dist/${STAGE}/LICENSES.prism"
          ditto "${BUILD_DIR}/Melee.app" "dist/${STAGE}/Melee.app"
          cp "${BUILD_DIR}/melee-netcheck" "dist/${STAGE}/"
          strip -S "dist/${STAGE}/melee-netcheck"
          codesign --force --sign - --timestamp=none "dist/${STAGE}/melee-netcheck"
          otool -L "dist/${STAGE}/melee-netcheck"
          prism_dir="$(ls -d "${BUILD_DIR}"/prism-*/ | head -n 1)"
          cp -r "${prism_dir}LICENSES/." "${prism_dir}NOTICE" "dist/${STAGE}/LICENSES.prism/"
          stretch_dir="$(ls -d "${BUILD_DIR}"/signalsmith-stretch-*/ | head -n 1)"
          mkdir -p "dist/${STAGE}/LICENSES.signalsmith-stretch"
          cp "${stretch_dir}LICENSE.txt" "dist/${STAGE}/LICENSES.signalsmith-stretch/LICENSE.txt"
          cp "${stretch_dir}dsp/LICENSE.txt" "dist/${STAGE}/LICENSES.signalsmith-stretch/LICENSE-dsp.txt"
          cd dist
          ditto -c -k --keepParent "${STAGE}" "${MAC_ZIP}"
          ls -lh "${MAC_ZIP}"

      # The zip as a player gets it: unpacked, its folder listed with the two
      # documents required in it, signatures verified, the oldest
      # macOS each binary loads on (minos: the base port sets no deployment
      # target, so it is the runner's macOS, and Homebrew's dylibs are built
      # for it too), and melee started far enough for the dynamic loader to
      # find every bundled dylib, Prism's among them (--version prints and
      # quits).
      - name: Check the zip
        timeout-minutes: 5
        run: |
          mkdir zip-check
          ditto -x -k "dist/${MAC_ZIP}" zip-check
          find zip-check -maxdepth 2 | sort
          for doc in readme.html changelog.html; do
            if [[ ! -s "zip-check/${STAGE}/${doc}" ]]; then
              echo "error: ${doc} missing or empty in the zip" >&2
              exit 1
            fi
          done
          codesign --verify --deep --strict --verbose=2 "zip-check/${STAGE}/Melee.app"
          codesign --verify --strict --verbose=2 "zip-check/${STAGE}/melee-netcheck"
          file "zip-check/${STAGE}/Melee.app/Contents/MacOS/melee" "zip-check/${STAGE}/melee-netcheck"
          for f in "zip-check/${STAGE}/Melee.app/Contents/MacOS/melee" \
                   "zip-check/${STAGE}/Melee.app/Contents/Frameworks/"*.dylib \
                   "zip-check/${STAGE}/melee-netcheck"; do
            minos="$(otool -arch "${{ matrix.arch }}" -l "${f}" |
                     awk '$1 == "minos" { print $2; exit }')"
            echo "minos ${minos:-unknown}: $(basename "${f}")"
          done
          "zip-check/${STAGE}/Melee.app/Contents/MacOS/melee" --version

      - uses: actions/upload-artifact@v4
        with:
          name: NonVisualMelee-macOS-${{ matrix.arch }}
          path: dist/${{ env.MAC_ZIP }}
          if-no-files-found: error

      # The unit tests, the fork's suites and the base port's few that build
      # off Linux, in the same build directory, after the zip is kept.
      - name: Unit tests
        run: |
          ninja -C "${BUILD_DIR}" unit_tests
          ctest --test-dir "${BUILD_DIR}" -L melee --output-on-failure

  publish:
    name: Publish ci-latest
    needs: [windows, macos]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/dev' && needs.windows.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: NonVisualMelee-*
          path: dist
          merge-multiple: true

      # Delete and recreate rather than edit, so the tag always names the
      # commit that was built. The download links stay the same.
      - name: Publish ci-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh dist
          {
            echo "The newest build of dev, rebuilt on every push. Not a tested release."
            echo
            echo "Commit ${GITHUB_SHA::7}, $(git log -1 --format=%cs):"
            echo
            git log -1 --format=%B
            for zip in NonVisualMelee-macOS-arm64.zip NonVisualMelee-macOS-x86_64.zip; do
              if [[ ! -f "dist/${zip}" ]]; then
                echo
                echo "No ${zip} for this commit: its build failed."
              fi
            done
          } > notes.md
          gh release delete ci-latest --yes --cleanup-tag || true
          gh release create ci-latest \
            --prerelease \
            --target "${GITHUB_SHA}" \
            --title "Latest CI build" \
            --notes-file notes.md \
            dist/NonVisualMelee-*.zip

  # A versioned release, created as a draft for the release skill to check
  # and publish. The checks run again first, against a release made in the
  # meantime or by a re-run of this job alone, and write the notes and the
  # title. --verify-tag refuses a tag GitHub does not hold.
  release:
    name: Draft the release
    needs: [release-check, windows]
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: NonVisualMelee-Windows-x86_64
          path: dist

      - name: Check the tag again and write the notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/a11y/release_notes.py "${GITHUB_REF_NAME}" \
            --commit "${GITHUB_SHA}" --repo "${GITHUB_REPOSITORY}" \
            --notes notes.md --outputs "$GITHUB_OUTPUT"

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.notes.outputs.title }}
        run: |
          ls -lh dist
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --verify-tag \
            --title "${TITLE}" \
            --notes-file notes.md \
            "dist/${ZIP_NAME}"
